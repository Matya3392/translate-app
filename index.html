<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自作・簡単ほんやくアプリ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; text-align: center; }
    .box { background: white; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button { font-size: 18px; padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button.listening { background: #ff3b30; } /* 録音中は赤色に変わる */
    button:active { opacity: 0.8; }
    p { font-size: 18px; min-height: 1.5em; color: #333; margin: 10px 0; }
    .time-badge { display: inline-block; background: #e3f2fd; color: #0d47a1; padding: 4px 12px; border-radius: 16px; font-size: 14px; font-weight: bold; margin-top: 5px; }
    .error-msg { color: red; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🌏 My 探究翻訳アプリ</h1>

  <button id="startBtn">🎤 話しかける（日本語）</button>

    <p id="speechResult">ボタンを押して話してください...</p>
  </div>

  <div class="box">
    <h3>翻訳結果（英語）：</h3>
    <p id="translateResult">（ここに翻訳が表示されます）</p>
    <div id="timeResult" class="time-badge">処理時間: - 秒</div>
    <div id="errorLog" class="error-msg"></div>
  </div>

          startTime = performance.now();
